name: tests

# The engine's command layer is what breaks, and roughly half this suite's
# coverage comes from tests that need a real TypeDB. So CI runs one as a
# service container and sets MYTHRAS_REQUIRE_DB=1, which makes conftest refuse
# to start without it. Without that, the database tests would skip silently and
# the coverage floor could be satisfied by not running them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      typedb:
        # Kept in step with TYPEDB_VERSION and TYPEDB_IMAGE in mythras_gm.py;
        # tests/test_versions_are_in_step pins them together.
        image: typedb/typedb:3.8.0
        ports:
          # The container listens on 1729 INSIDE; docker-compose.yml maps
          # host 1730 to it and this must agree. Published as 1730:1730, the
          # TCP probe below still succeeded -- docker-proxy accepts the
          # connection -- and every driver call then failed with "unreachable".
          - 1730:1729

    env:
      TYPEDB_HOST: localhost
      TYPEDB_PORT: "1730"
      MYTHRAS_REQUIRE_DB: "1"
      # conftest forces the database name to mythras_pytest and refuses to
      # inherit a live one, but being explicit here documents the intent.
      TYPEDB_DATABASE: mythras_pytest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Wait for TypeDB to accept driver connections
        # Opens a real driver connection, not a TCP socket. A bare socket probe
        # passes against docker-proxy whether or not anything is listening
        # inside the container, which is exactly how a wrong port mapping got
        # through here once already.
        run: |
          uv run -q --project skills/mythras-gm python - <<'PY'
          import sys, time
          from typedb.driver import TypeDB, Credentials, DriverOptions
          for attempt in range(60):
              try:
                  d = TypeDB.driver("localhost:1730",
                                    Credentials("admin", "password"),
                                    DriverOptions(is_tls_enabled=False))
                  print("TypeDB answered the driver after %ds; databases: %s"
                        % (attempt, sorted(x.name for x in d.databases.all())))
                  sys.exit(0)
              except Exception as exc:
                  last = exc
                  time.sleep(1)
          sys.exit("TypeDB never answered a driver connection: %r" % (last,))
          PY

      - name: Run the suite with the coverage floor
        # The floor lives in pyproject.toml so this workflow and a local run
        # enforce the same number.
        run: >
          uv run -q --project skills/mythras-gm
          --with pytest --with pytest-cov
          pytest tests/ --cov --cov-report=term --cov-report=xml

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
